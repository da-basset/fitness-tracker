          minLength: 1
          description: e.g. "Ramp-In", "Build", "Deload"
          maxLength: 60
        note:
          type: string
          description: May include simple HTML like <strong>.
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - title
    PlanAssignRequest:
      type: object
      properties:
        client_id:
          type: integer
      required:
      - client_id
    PlanDetail:
