        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          default: ''
        trainer_id:
          type: integer
          readOnly: true
        source_plan_id:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
