openapi: 3.0.3
info:
  title: Fitness Tracker Native API
  version: 1.0.0
  description: Versioned JWT API for the Fitness Tracker native client.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Invalid refresh token.
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/exercises/{exercise_id}/sets/{set_number}/completion/:
    put:
      operationId: exercises_sets_completion_update
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      - in: path
        name: set_number
        schema:
          type: integer
        required: true
      tags:
      - exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Invalid set number.
    delete:
      operationId: exercises_sets_completion_destroy
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      - in: path
        name: set_number
        schema:
          type: integer
        required: true
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Invalid set number.
  /api/v1/history/:
    get:
      operationId: history_retrieve
      description: |-
        Finished workouts between two dates (inclusive), newest first, with a
        count of checked sets per day -- the basis for history/streak screens.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - history
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/plans/active/:
    get:
      operationId: plans_active_retrieve
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/plans/active/schedule/:
    get:
      operationId: plans_active_schedule_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/sync/:
    post:
      operationId: sync_create
      description: |-
        Apply a batch of queued offline changes.

        Each event gets its own result: ``applied``; ``duplicate`` (this id was
        already received -- safe to drop from the device queue); ``stale`` (a
        newer change to the same set/workout/day already won); or ``rejected``
        with ``errors`` (bad input or not part of the active plan -- retrying
        won't help). Every status except a network failure means the device can
        remove the event from its queue.
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
  /api/v1/weeks/{week_id}/workouts/{workout_id}/completion/:
    put:
      operationId: weeks_workouts_completion_update
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: week_id
        schema:
          type: integer
        required: true
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Workout is not scheduled in week.
    delete:
      operationId: weeks_workouts_completion_destroy
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: week_id
        schema:
          type: integer
        required: true
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - weeks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Workout is not scheduled in week.
  /api/v1/workouts/{workout_id}/:
    get:
      operationId: workouts_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - workouts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Completion:
      type: object
      properties:
        completed:
          type: boolean
        week_tally:
          $ref: '#/components/schemas/WeekTally'
      required:
      - completed
    CompletionRequest:
      type: object
      properties:
        completed:
          type: boolean
        week_tally:
          $ref: '#/components/schemas/WeekTallyRequest'
      required:
      - completed
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    PatchedMeUpdateRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    StatusEnum:
      enum:
      - applied
      - stale
      - duplicate
      - rejected
      type: string
      description: |-
        * `applied` - applied
        * `stale` - stale
        * `duplicate` - duplicate
        * `rejected` - rejected
    SyncRequestRequest:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 500
      required:
      - events
    SyncResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncResult'
      required:
      - results
    SyncResult:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        errors:
          type: object
          additionalProperties: {}
      required:
      - id
      - status
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    WeekTally:
      type: object
      properties:
        completed:
          type: integer
        total:
          type: integer
        week_complete:
          type: boolean
      required:
      - completed
      - total
      - week_complete
    WeekTallyRequest:
      type: object
      properties:
        completed:
          type: integer
        total:
          type: integer
        week_complete:
          type: boolean
      required:
      - completed
      - total
      - week_complete
    WorkoutTimingRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
