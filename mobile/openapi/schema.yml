  /api/v1/exercises/{exercise_id}/sets/{set_number}/completion/:
    put:
      operationId: exercises_sets_completion_update
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      - in: path
        name: set_number
        schema:
          type: integer
        required: true
      tags:
      - exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Invalid set number.
    delete:
      operationId: exercises_sets_completion_destroy
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: exercise_id
        schema:
          type: integer
        required: true
      - in: path
        name: set_number
        schema:
          type: integer
        required: true
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Invalid set number.
  /api/v1/history/:
    get:
      operationId: history_retrieve
      description: |-
        Finished workouts between two dates (inclusive), newest first, with a
        count of checked sets per day -- the basis for history/streak screens.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - history
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
          description: ''
