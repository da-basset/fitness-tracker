      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
      required:
      - description
      - id
      - name
    PlanSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          default: ''
        trainer_id:
          type: integer
          readOnly: true
        source_plan_id:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - name
      - source_plan_id
      - trainer_id
    PlanSummaryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          default: ''
      required:
      - name
