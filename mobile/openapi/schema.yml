          type: string
          minLength: 1
          maxLength: 150
        amount:
          type: string
          description: e.g. "180g/day" or "5g"
          maxLength: 100
        timing:
          type: string
          description: e.g. "Morning" or "Post-workout"
          maxLength: 100
        notes:
          type: string
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
