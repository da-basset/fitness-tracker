        segment:
          $ref: '#/components/schemas/SegmentEnum'
        name:
          type: string
          minLength: 1
          maxLength: 200
        sets_count:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
        reps_text:
          type: string
          maxLength: 60
        rest_seconds:
          type: integer
          maximum: 3600
          minimum: 0
          nullable: true
        time_text:
          type: string
          maxLength: 20
    PatchedMeUpdateRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    PatchedNutrientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        amount:
          type: string
          description: e.g. "180g/day" or "5g"
          maxLength: 100
        timing:
          type: string
          description: e.g. "Morning" or "Post-workout"
          maxLength: 100
        notes:
          type: string
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
    PatchedPhaseRequest:
      type: object
      properties:
        title:
