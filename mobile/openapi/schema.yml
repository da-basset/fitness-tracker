  /api/v1/sync/:
    post:
      operationId: sync_create
      description: |-
        Apply a batch of queued offline changes.

        Each event gets its own result: ``applied``; ``duplicate`` (this id was
        already received -- safe to drop from the device queue); ``stale`` (a
        newer change to the same set/workout/day already won); or ``rejected``
        with ``errors`` (bad input or not part of the active plan -- retrying
        won't help). Every status except a network failure means the device can
        remove the event from its queue.
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
  /api/v1/trainers/:
    get:
      operationId: trainers_list
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trainer'
          description: ''
    post:
      operationId: trainers_create
      tags:
      - trainers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
          description: ''
  /api/v1/trainers/{trainer_id}/plans/:
    get:
      operationId: trainers_plans_list
      parameters:
      - in: path
        name: trainer_id
        schema:
          type: integer
        required: true
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanSummary'
          description: ''
    post:
      operationId: trainers_plans_create
      parameters:
      - in: path
        name: trainer_id
        schema:
          type: integer
        required: true
      tags:
      - trainers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanSummaryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSummary'
          description: ''
  /api/v1/weeks/{week_id}/workouts/{workout_id}/completion/:
    put:
      operationId: weeks_workouts_completion_update
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: week_id
        schema:
          type: integer
        required: true
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkoutTimingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Workout is not scheduled in week.
    delete:
      operationId: weeks_workouts_completion_destroy
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: week_id
        schema:
          type: integer
        required: true
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - weeks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
          description: ''
        '400':
          description: Workout is not scheduled in week.
  /api/v1/workouts/{workout_id}/:
    get:
      operationId: workouts_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local calendar day (YYYY-MM-DD). Defaults to today
          in the user's time zone.
      - in: path
        name: workout_id
        schema:
          type: integer
        required: true
      tags:
      - workouts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWorkout'
          description: ''
components:
  schemas:
    AccountCreateRequest:
      type: object
      description: |-
        New login for a Trainer or Client. Validation is the web form's
        (username uniqueness, Django's password validators), so both surfaces
        accept and reject the same accounts.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
      required:
      - password
      - username
    ActiveAssignment:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        assigned_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        trainer_id:
          type: integer
        gym_id:
          type: integer
      required:
      - assigned_at
      - client_id
      - gym_id
      - id
      - is_active
      - trainer_id
    ActivePlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        assignment:
          $ref: '#/components/schemas/ActiveAssignment'
      required:
      - assignment
      - description
      - id
      - name
    ActivePlanRef:
      type: object
      properties:
        assignment_id:
          type: integer
        plan_id:
          type: integer
        plan_name:
          type: string
        assigned_at:
          type: string
          format: date-time
      required:
      - assigned_at
      - assignment_id
      - plan_id
      - plan_name
    Assignment:
      type: object
      properties:
        id:
          type: integer
        plan_id:
          type: integer
        plan_name:
          type: string
        client_id:
          type: integer
        assigned_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - assigned_at
      - client_id
      - id
      - is_active
      - plan_id
      - plan_name
    ClientDetail:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        name:
          type: string
          readOnly: true
        id:
          type: integer
        trainer_id:
          type: integer
        trainer_name:
          type: string
          readOnly: true
        active_plan:
          allOf:
          - $ref: '#/components/schemas/ActivePlanRef'
          nullable: true
          readOnly: true
        active_assignment:
          allOf:
          - $ref: '#/components/schemas/Assignment'
          nullable: true
        past_assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        stats:
          allOf:
          - $ref: '#/components/schemas/ClientStats'
          nullable: true
        templates:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
      required:
      - active_assignment
      - active_plan
      - email
      - first_name
      - id
      - last_name
      - name
      - past_assignments
      - stats
      - templates
      - trainer_id
      - trainer_name
      - user_id
      - username
    ClientExercise:
      type: object
      properties:
        id:
          type: integer
        segment:
          $ref: '#/components/schemas/SegmentEnum'
        name:
          type: string
        sets_count:
          type: integer
          nullable: true
        reps_text:
          type: string
        rest_seconds:
          type: integer
          nullable: true
        time_text:
          type: string
        order:
          type: integer
        completed_set_numbers:
          type: array
          items:
            type: integer
      required:
      - completed_set_numbers
      - id
      - name
      - order
      - reps_text
      - rest_seconds
      - segment
      - sets_count
      - time_text
    ClientStats:
      type: object
      properties:
        all_time_completed:
          type: integer
        last_completed_at:
          type: string
          format: date
          nullable: true
      required:
      - all_time_completed
      - last_completed_at
    ClientSummary:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        name:
          type: string
          readOnly: true
        id:
          type: integer
        trainer_id:
          type: integer
        trainer_name:
          type: string
          readOnly: true
        active_plan:
          allOf:
          - $ref: '#/components/schemas/ActivePlanRef'
          nullable: true
          readOnly: true
      required:
      - active_plan
      - email
      - first_name
      - id
      - last_name
      - name
      - trainer_id
      - trainer_name
      - user_id
      - username
    ClientWorkout:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sub:
          type: string
        flavor:
          type: string
        color:
          type: string
        order:
          type: integer
        date:
          type: string
          format: date
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ClientExercise'
        workout_completed:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
      required:
      - color
      - date
      - ended_at
      - exercises
      - flavor
      - id
      - name
      - order
      - started_at
      - sub
      - workout_completed
    ColorEnum:
      enum:
      - red
      - blue
      - green
      - amber
      - violet
      - teal
      - rose
      type: string
      description: |-
        * `red` - Red
        * `blue` - Blue
        * `green` - Green
        * `amber` - Amber
        * `violet` - Violet
        * `teal` - Teal
        * `rose` - Rose
    Completion:
      type: object
      properties:
        completed:
          type: boolean
        week_tally:
          $ref: '#/components/schemas/WeekTally'
      required:
      - completed
      - week_tally
    CompletionRequest:
      type: object
      properties:
        completed:
          type: boolean
        week_tally:
          $ref: '#/components/schemas/WeekTallyRequest'
      required:
      - completed
    Exercise:
      type: object
      description: Same limits as the web editor's _validate_exercise_payload.
      properties:
        id:
          type: integer
          readOnly: true
        workout_id:
          type: integer
          readOnly: true
        segment:
          $ref: '#/components/schemas/SegmentEnum'
        name:
          type: string
          maxLength: 200
        sets_count:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
        reps_text:
          type: string
          maxLength: 60
        rest_seconds:
          type: integer
          maximum: 3600
          minimum: 0
          nullable: true
        time_text:
          type: string
          maxLength: 20
        order:
          type: integer
          readOnly: true
        is_custom:
          type: boolean
          readOnly: true
      required:
      - id
      - is_custom
      - name
      - order
      - reps_text
      - rest_seconds
      - segment
      - sets_count
      - time_text
      - workout_id
    ExerciseOrderRequest:
      type: object
      properties:
        order:
          type: array
          items:
            type: integer
      required:
      - order
    ExerciseRequest:
      type: object
      description: Same limits as the web editor's _validate_exercise_payload.
      properties:
        segment:
          $ref: '#/components/schemas/SegmentEnum'
        name:
          type: string
          minLength: 1
          maxLength: 200
        sets_count:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
        reps_text:
          type: string
          maxLength: 60
        rest_seconds:
          type: integer
          maximum: 3600
          minimum: 0
          nullable: true
        time_text:
          type: string
          maxLength: 20
      required:
      - name
      - segment
    History:
      type: object
      properties:
        to:
          type: string
          format: date
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/HistoryWorkout'
        sets_completed_by_date:
          type: object
          additionalProperties:
            type: integer
        from:
          type: string
          format: date
      required:
      - from
      - sets_completed_by_date
      - to
      - workouts
    HistoryWorkout:
      type: object
      properties:
        date:
          type: string
          format: date
        workout:
          $ref: '#/components/schemas/WorkoutSummary'
        week_id:
          type: integer
          nullable: true
        completed_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
      required:
      - completed_at
      - date
      - ended_at
      - started_at
      - week_id
      - workout
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
        client_id:
          type: integer
          nullable: true
        trainer_id:
          type: integer
          nullable: true
        gym_id:
          type: integer
          nullable: true
        owned_gym_ids:
          type: array
          items:
            type: integer
        timezone:
          type: string
        today:
          type: string
          format: date
      required:
      - client_id
      - email
      - first_name
      - gym_id
      - id
      - last_name
      - owned_gym_ids
      - roles
      - timezone
      - today
      - trainer_id
      - username
    Note:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        amount:
          type: string
        timing:
          type: string
        notes:
          type: string
      required:
      - amount
      - id
      - name
      - notes
      - timing
    Nutrient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        amount:
          type: string
          description: e.g. "180g/day" or "5g"
          maxLength: 100
        timing:
          type: string
          description: e.g. "Morning" or "Post-workout"
          maxLength: 100
        notes:
          type: string
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - amount
      - id
      - name
      - notes
      - order
      - timing
    NutrientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        amount:
          type: string
          description: e.g. "180g/day" or "5g"
          maxLength: 100
        timing:
          type: string
          description: e.g. "Morning" or "Post-workout"
          maxLength: 100
        notes:
          type: string
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - name
    OwningClient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    PatchedExerciseRequest:
      type: object
