{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Fitness Tracker</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=13">
</head>
<body class="login-page">
  <main class="login-screen">
    <div class="login-card">
      <h1 class="login-title">Fitness Tracker</h1>
      <p class="login-byline">By: Isaac Spann</p>
      <p class="login-subtitle">Sign in to view your training plan.</p>

      {% if form.errors %}
        <div class="form-error">Incorrect username or password. Try again.</div>
      {% endif %}

      <form method="post" class="login-form">
        {% csrf_token %}
        <label class="form-field">
          <span>Username</span>
          {{ form.username }}
        </label>
        <label class="form-field">
          <span>Password</span>
          {{ form.password }}
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary">Log in</button>
      </form>
    </div>
  </main>
</body>
</html>
